<style>
body, html, div {
    border: 0;
    padding: 0;
}
#board {
    width: 100%;
}
#gemini, #chatgpt {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5em;
    font: bold 1.25em system-ui, sans-serif;
}

    width: 2em;

<div id="gemini">
    <img src="images/gemini-logo.svg" alt="Google Gemini">
    <span>Gemini</span>
</div>
<div id="board"></div>
<div id="chatgpt">
    <img src="images/openai-chatgpt-logo.svg" alt="OpenAI ChatGPT">
    <span>ChatGPT</span>
</div>
<script src="pubnub.js"></script>
<script>
    const GAME_CHANNEL = "chess-battle";
    const pubnub = PubNub({});
    const board = Chessboard2('board', 'start');
    pubnub.subscribe({
        channel : GAME_CHANNEL,
        messages : update_board,
        timetoken: '0',
    });
    function update_board(move) {
        console.log(move);
        playAudio('vine-boom.mp3');
        //if (Math.random() > 0.5)
            //playAudio('vine-boom.mp3');
        //else
            //playAudio('faahh.mp3');
        board.move(move);
    }
    //console.log(board.fen());
    //console.log(board.position());
    function playAudio(audioUrl) {
        const audio = new Audio(audioUrl);
        audio.play().catch((error) => {
            console.error("Playback prevented by browser permissions or file error:", error);
        });
    }
    </script>
